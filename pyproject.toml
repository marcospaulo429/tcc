[project]
name = "crosslayer"
version = "0.1.0"
description = "Cross-Layer Agentic RL — infraestrutura experimental do TCC"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "numpy>=1.26",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
serving = ["vllm==0.8.5.post1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trajectories", "agent", "interventions", "experiments"]
